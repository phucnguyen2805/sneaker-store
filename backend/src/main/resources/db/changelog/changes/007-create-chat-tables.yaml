databaseChangeLog:
  - changeSet:
      id: 007-create-chat-tables
      author: sneakerstore

      changes:
        # =====================================================
        # CHAT CONVERSATIONS
        # =====================================================

        - createTable:
            tableName: chat_conversations

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_chat_conversations

              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: assigned_admin_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: last_message_at
                  type: DATETIME

        # =====================================================
        # CHAT MESSAGES
        # =====================================================

        - createTable:
            tableName: chat_messages

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_chat_messages

              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sender_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: sender_id
                  type: BIGINT

              - column:
                  name: content
                  type: LONGTEXT
                  constraints:
                    nullable: false

              - column:
                  name: is_read
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

        # =====================================================
        # FOREIGN KEYS
        # =====================================================

        - addForeignKeyConstraint:
            baseTableName: chat_conversations
            baseColumnNames: customer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_conversation_customer
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: chat_conversations
            baseColumnNames: assigned_admin_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chat_conversation_admin
            onDelete: SET NULL

        - addForeignKeyConstraint:
            baseTableName: chat_messages
            baseColumnNames: conversation_id
            referencedTableName: chat_conversations
            referencedColumnNames: id
            constraintName: fk_chat_message_conversation
            onDelete: CASCADE

        # =====================================================
        # INDEXES
        # =====================================================

        - createIndex:
            indexName: idx_chat_conversation_customer
            tableName: chat_conversations
            columns:
              - column:
                  name: customer_id

        - createIndex:
            indexName: idx_chat_conversation_type_status
            tableName: chat_conversations
            columns:
              - column:
                  name: type

              - column:
                  name: status

        - createIndex:
            indexName: idx_chat_conversation_admin
            tableName: chat_conversations
            columns:
              - column:
                  name: assigned_admin_id

        - createIndex:
            indexName: idx_chat_conversation_last_message
            tableName: chat_conversations
            columns:
              - column:
                  name: last_message_at

        - createIndex:
            indexName: idx_chat_message_conversation_created
            tableName: chat_messages
            columns:
              - column:
                  name: conversation_id

              - column:
                  name: created_at

        - createIndex:
            indexName: idx_chat_message_read
            tableName: chat_messages
            columns:
              - column:
                  name: is_read
