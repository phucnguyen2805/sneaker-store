databaseChangeLog:
  # =========================================================
  # SEED COLORS
  # =========================================================
  - changeSet:
      id: 005-seed-colors
      author: sneakerstore
      changes:
        - insert:
            tableName: colors
            columns:
              - column:
                  name: name
                  value: White
