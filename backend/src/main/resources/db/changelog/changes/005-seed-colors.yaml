        - insert:
            tableName: colors
            columns:
              - column:
                  name: name
                  value: Red
              - column:
                  name: hex_code
                  value: "#FF0000"

        - insert:
            tableName: colors
            columns:
              - column:
                  name: name
                  value: Blue
              - column:
                  name: hex_code
                  value: "#0000FF"
