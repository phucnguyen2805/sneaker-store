# ========================================
# APPLICATION
# ========================================
spring.application.name=sneaker-store-backend

# ========================================
# MYSQL DATABASE
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/sneaker_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# LIQUIBASE
# ========================================
spring.liquibase.enabled=true

# ========================================
# SERVER
# ========================================
server.port=8080
