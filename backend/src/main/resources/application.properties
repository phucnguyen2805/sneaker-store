# ========================================
# APPLICATION
# ========================================
spring.application.name=sneaker-store-backend

# ========================================
# MYSQL DATABASE
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/sneaker_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# LIQUIBASE
# ========================================
spring.liquibase.enabled=true

# ========================================
# SERVER
# ========================================
server.port=8080

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# CLOUDINARY
# ========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# ========================================
# GEMINI AI (Google AI Studio)
# ========================================
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite